<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>音楽の操作（掲示物テレビ）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Meiryo", sans-serif; background: #f3f5f8; color: #1f2937; }
  header { background: #1e3a5f; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  #conn { font-size: .85rem; padding: 2px 10px; border-radius: 99px; background: #64748b; }
  #conn.online { background: #16a34a; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1; min-width: 200px; font-size: 1rem; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
  button { font-size: .95rem; padding: 8px 14px; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: #2563eb; }
  button:disabled { opacity: .5; cursor: default; }
  #viewport { position: relative; background: #000; border-radius: 8px; overflow: hidden; min-height: 200px; display: flex; align-items: center; justify-content: center; }
  #frame { display: block; width: 100%; height: auto; cursor: pointer; }
  #empty { color: #cbd5e1; padding: 40px; }
  #msg { min-height: 1.3em; font-size: .9rem; color: #475569; margin-top: 6px; }
  #title { font-weight: bold; } #url { color: #64748b; font-size: .85rem; word-break: break-all; }
  #pinBox { max-width: 420px; margin: 40px auto; text-align: center; }
  #pin { font-size: 2rem; letter-spacing: .4em; text-align: center; width: 9em; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .err { color: #b91c1c; min-height: 1.3em; }
  .hide { display: none !important; }
</style>
</head>
<body>
<header><h1>音楽の操作（掲示物テレビ）</h1><span id="conn">未接続</span></header>
<main>
  <section id="pairView" class="card hide">
    <div id="pinBox">
      <p>テレビの右下に出ている<b>4桁の接続番号</b>を入力してください。</p>
      <p><input id="pin" type="text" inputmode="numeric" maxlength="4" autocomplete="off"></p>
      <p class="row" style="justify-content:center"><button id="pairBtn" type="button">接続する</button><button id="showPin" type="button" class="ghost">番号をテレビに出す</button></p>
      <p id="pairErr" class="err"></p>
    </div>
  </section>
  <section id="ctrlView" class="hide">
    <div class="card">
      <div class="row">
        <button type="button" data-preset="youtube">YouTube（テスト曲）</button>
        <button type="button" data-preset="mp3">MP3（予備）</button>
        <span style="flex:1"></span>
        <button type="button" class="ghost" data-act="back">戻る</button>
        <button type="button" class="ghost" data-act="forward">進む</button>
        <button type="button" class="ghost" data-act="reload">再読込</button>
        <button type="button" class="ghost" data-act="stop">停止</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input id="addr" type="text" placeholder="URL または検索する言葉">
        <button id="openBtn" type="button">開く／検索</button>
      </div>
    </div>
    <div class="card">
      <div id="title"></div><div id="url"></div>
      <div id="viewport" style="margin-top:8px"><img id="frame" class="hide" alt="テレビ内の音楽画面"><div id="empty">画面を読み込んでいます…</div></div>
      <div class="row" style="margin-top:8px">
        <input id="text" type="text" placeholder="文字を送る（先に画面の入力欄をクリック）">
        <button id="textBtn" type="button">文字を送る</button>
        <button type="button" class="ghost" data-key="Enter">Enter</button>
        <button type="button" class="ghost" data-key="Backspace">1文字消す</button>
        <button type="button" class="ghost" data-key="Tab">Tab</button>
        <button type="button" class="ghost" data-key="Escape">Esc</button>
        <button type="button" class="ghost" data-key="Space">空白</button>
      </div>
      <div id="msg"></div>
    </div>
  </section>
</main>
<script>
(function () {
  var TOKEN_KEY = 'keijiMusicToken';
  var token = '';
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }
  var $ = function (id) { return document.getElementById(id); };
  var frameUrl = '', polling = false, lastWheel = 0;

  function setConn(on) { $('conn').textContent = on ? 'テレビに接続中' : '未接続'; $('conn').classList.toggle('online', on); }
  function showPair() {
    token = ''; try { localStorage.removeItem(TOKEN_KEY); } catch (e) { }
    polling = false; setConn(false);
    $('ctrlView').classList.add('hide'); $('pairView').classList.remove('hide');
    $('pin').value = ''; $('pin').focus();
    requestPin();
  }
  function showCtrl() {
    $('pairView').classList.add('hide'); $('ctrlView').classList.remove('hide');
    if (!polling) { polling = true; pollFrame(); pollState(); }
  }
  function requestPin() { fetch('/api/pin-request', { method: 'POST' }).catch(function () { }); }
  function form(obj) {
    return Object.keys(obj).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]); }).join('&');
  }
  function api(path, opt) {
    opt = opt || {};
    var h = { 'Authorization': 'Bearer ' + token };
    if (opt.body) h['Content-Type'] = 'application/x-www-form-urlencoded';
    return fetch(path, { method: opt.method || 'GET', headers: h, body: opt.body, cache: 'no-store' }).then(function (r) {
      if (r.status === 401) { showPair(); throw new Error('もう一度接続番号を入れてください'); }
      return r;
    });
  }
  function send(cmd) {
    return api('/api/command', { method: 'POST', body: form(cmd) }).then(function (r) {
      if (r.status === 200) { $('msg').textContent = 'テレビへ操作を送りました'; return true; }
      $('msg').textContent = r.status === 400 ? 'この操作は送れません' : r.status === 503 ? 'テレビが混み合っています。少し待ってください' : '送れませんでした（' + r.status + '）';
      return false;
    }).catch(function (e) { $('msg').textContent = e.message || '送れませんでした'; return false; });
  }

  $('pairBtn').addEventListener('click', function () {
    var pin = $('pin').value.trim();
    $('pairErr').textContent = '';
    fetch('/api/pair', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form({ pin: pin }) })
      .then(function (r) {
        if (r.status === 429) throw new Error('間違いが続いたので5分間お待ちください');
        if (r.status !== 200) throw new Error('番号が違います。テレビの番号を確かめてください');
        return r.json();
      }).then(function (d) {
        token = d.token; try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { }
        showCtrl();
      }).catch(function (e) { $('pairErr').textContent = e.message; });
  });
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('pairBtn').click(); });
  $('showPin').addEventListener('click', requestPin);

  document.querySelectorAll('[data-preset]').forEach(function (b) { b.addEventListener('click', function () { send({ action: 'preset', value: b.getAttribute('data-preset') }); }); });
  document.querySelectorAll('[data-act]').forEach(function (b) { b.addEventListener('click', function () { send({ action: b.getAttribute('data-act') }); }); });
  document.querySelectorAll('[data-key]').forEach(function (b) { b.addEventListener('click', function () { send({ action: 'key', value: b.getAttribute('data-key') }); }); });
  function openAddr() {
    var v = $('addr').value.trim();
    if (!v) return;
    var url = /^https?:\/\//i.test(v) ? v : /^[\w-]+(\.[\w-]+)+(\/|$)/.test(v) ? 'https://' + v : 'https://www.google.com/search?q=' + encodeURIComponent(v);
    send({ action: 'navigate', value: url });
  }
  $('openBtn').addEventListener('click', openAddr);
  $('addr').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); openAddr(); } });
  $('textBtn').addEventListener('click', function () {
    var v = $('text').value;
    if (!v) return;
    send({ action: 'text', value: v }).then(function (ok) { if (ok) $('text').value = ''; });
  });
  $('text').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('textBtn').click(); } });
  $('frame').addEventListener('click', function (e) {
    var r = $('frame').getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return;
    var x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    var y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    send({ action: 'click', x: x.toFixed(4), y: y.toFixed(4) });
  });
  $('viewport').addEventListener('wheel', function (e) {
    if (!polling) return;
    e.preventDefault();
    if (Date.now() - lastWheel < 180) return;
    lastWheel = Date.now();
    send({ action: 'scroll', dy: String(Math.round(Math.max(-1800, Math.min(1800, e.deltaY)))) });
  }, { passive: false });

  function pollFrame() {
    if (!polling) return;
    api('/api/frame').then(function (r) {
      if (r.status === 200) return r.blob().then(function (b) {
        var u = URL.createObjectURL(b);
        $('frame').src = u; if (frameUrl) URL.revokeObjectURL(frameUrl); frameUrl = u;
        $('frame').classList.remove('hide'); $('empty').classList.add('hide');
      });
    }).then(function () { setConn(true); }, function () { setConn(false); })
      .then(function () { setTimeout(pollFrame, 1000); });
  }
  function pollState() {
    if (!polling) return;
    api('/api/state').then(function (r) { return r.status === 200 ? r.json() : null; }).then(function (s) {
      if (!s) return;
      $('title').textContent = s.title || 'テレビ内の音楽画面';
      $('url').textContent = s.url === 'about:blank' ? '' : (s.url || '');
      if (s.error) $('msg').textContent = s.error;
    }).catch(function () { }).then(function () { setTimeout(pollState, 2000); });
  }

  if (token) showCtrl(); else showPair();
})();
</script>
</body>
</html>
