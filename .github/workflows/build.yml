name: Build APK (keiji-tv)

# main に push するたびに組み立て、Release「latest」の keiji-tv.apk を差し替える。
# テレビの Downloader からは次の固定 URL で入れられる:
#   https://github.com/sanmi-dev/keiji-tv-kiosk/releases/latest/download/keiji-tv.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk keiji-tv.apk

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "掲示物テレビ（最新）" --notes "main への push ごとに自動で差し替え"
          gh release upload latest keiji-tv.apk --clobber
